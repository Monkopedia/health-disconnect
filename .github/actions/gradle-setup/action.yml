name: Set up a verified Gradle build environment
description: >-
  Validates the committed Gradle wrapper JAR, installs JDK 21 and the Android SDK, and purges the
  cached Gradle distribution so that the distributionSha256Sum pin is actually checked on this run.

runs:
  using: composite
  steps:
    # gradle/wrapper/gradle-wrapper.jar is committed to this repo and is executed by every Gradle
    # step before any of our own code runs, so a tampered JAR would own the build before a single
    # test does. This action checks it against the SHA-256 set Gradle publishes for every official
    # release. It must sit ahead of the first ./gradlew invocation, or it is auditing a JAR that
    # has already run. See #80.
    - uses: gradle/actions/wrapper-validation@v6

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: gradle

    # The JAR check above covers the wrapper; gradle-wrapper.properties also pins
    # distributionSha256Sum, which makes the wrapper verify the distribution ZIP it downloads.
    #
    # This purge is what keeps that pin from being decorative. The wrapper writes an `.ok` marker
    # beside each unpacked distribution and, when it finds one, returns the existing install
    # WITHOUT downloading or checksumming anything (Install.java) — so verification happens on
    # download only. setup-java caches ~/.gradle/wrapper; its primary cache key includes
    # gradle-wrapper.properties, but it also falls back to restore-keys, which can restore an
    # older cache containing an already-unpacked distribution and its `.ok` marker. On such a run
    # the pinned checksum is never compared to anything and the build stays green while verifying
    # nothing. Deleting the unpacked distributions forces a real download, and therefore a real
    # verification, on every run. Cost measured on ci.yml: 2-3s.
    - name: Force the wrapper to re-download and verify the distribution
      shell: bash
      run: |
        # distributionBase/distributionPath below must match gradle-wrapper.properties. If either
        # is changed there and not here, this purge silently stops matching anything, the `.ok`
        # short-circuit returns, and the checksum pin goes inert with NO signal — a green build
        # that verifies nothing, i.e. precisely the failure this step exists to prevent. Assert
        # rather than trust, so the break is loud instead of invisible.
        EXPECTED_BASE='GRADLE_USER_HOME'
        EXPECTED_PATH='wrapper/dists'
        PROPS='gradle/wrapper/gradle-wrapper.properties'
        ACTUAL_BASE=$(sed -n 's/^distributionBase=//p' "$PROPS")
        ACTUAL_PATH=$(sed -n 's/^distributionPath=//p' "$PROPS")
        if [ "$ACTUAL_BASE" != "$EXPECTED_BASE" ] || [ "$ACTUAL_PATH" != "$EXPECTED_PATH" ]; then
          echo "::error::$PROPS says distributionBase=$ACTUAL_BASE distributionPath=$ACTUAL_PATH,"
          echo "::error::but this step purges \$GRADLE_USER_HOME/$EXPECTED_PATH. Update this step to"
          echo "::error::match, or distributionSha256Sum stops being verified on every run."
          exit 1
        fi
        rm -rf "${GRADLE_USER_HOME:-$HOME/.gradle}/$EXPECTED_PATH"

    - uses: android-actions/setup-android@v3
