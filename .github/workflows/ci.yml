name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Backstop so a hung run fails fast and frees the runner instead of wedging for hours.
    timeout-minutes: 20
    # contents: write is needed so the record-and-commit step below can push the
    # regenerated screenshot baselines back to the PR head branch. On fork PRs the
    # GITHUB_TOKEN is downgraded to read-only, so that step is guarded to same-repo PRs.
    permissions:
      contents: write

    steps:
      # For pull_request events we check out the PR head branch (not the default
      # detached merge ref) with persisted credentials, so the record-and-commit
      # step can push the regenerated baselines straight back onto the PR. For push
      # events this falls back to the pushed ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      # gradle/wrapper/gradle-wrapper.jar is committed to this repo and is executed by every
      # step below before any of our own code runs, so a tampered JAR would own the build
      # before a single test does. This action checks it against the SHA-256 set Gradle
      # publishes for every official release. It must sit immediately after checkout, ahead
      # of the first ./gradlew invocation, or it is auditing a JAR that has already run. See #80.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The JAR check above covers the wrapper; gradle-wrapper.properties now also pins
      # distributionSha256Sum, which makes the wrapper verify the distribution ZIP it downloads.
      #
      # This purge is what keeps that pin from being decorative. The wrapper writes an `.ok`
      # marker beside each unpacked distribution and, when it finds one, returns the existing
      # install WITHOUT downloading or checksumming anything (Install.java) — so verification
      # happens on download only. setup-java caches ~/.gradle/wrapper; its primary cache key
      # includes gradle-wrapper.properties, but it also falls back to restore-keys, which can
      # restore an older cache containing an already-unpacked distribution and its `.ok` marker.
      # On such a run the pinned checksum is never compared to anything, and CI stays green
      # while verifying nothing. Deleting the unpacked distributions forces a real download and
      # therefore a real verification on every run.
      #
      # Cost is one distribution download (~1-2 min) that would otherwise be restored from
      # cache at similar cost, since the cache holds the same bytes.
      - name: Force the wrapper to re-download and verify the distribution
        run: rm -rf "${GRADLE_USER_HOME:-$HOME/.gradle}/wrapper/dists"

      - uses: android-actions/setup-android@v3

      - name: Run unit tests
        run: ./gradlew testProdDebugUnitTest

      # The demo flavor is ~700 lines that no other CI step builds — it is absent from every
      # gradle invocation in this workflow and from testProdDebugUnitTest's task graph. It does
      # not ship (release.yml builds prod only), so this is not a release guard; it protects the
      # flavor used for on-device rendering verification, whose DemoDataSeeder calls
      # encodeDataViewEntity and would otherwise rot silently until someone needed it. See #65.
      #
      # Deliberately a compile-only check and NOT ./gradlew allTests: whether CI should run the
      # full gate (lint, androidTest compile) is a separate, larger decision tracked in #68.
      - name: Compile demo flavor
        run: ./gradlew :app:compileDemoDebugSources

      # Release-build guard for #56: the app identifies Health Connect record types by
      # KClass.qualifiedName (persisted in saved views) and labels them by simpleName, so if R8
      # obfuscates androidx.health.connect.client.records.** those names go unstable and every
      # saved view breaks after an update. Unit tests run against un-minified classes and can't
      # see this, so we run R8 for the release variant and assert the record classes keep their
      # real names in the mapping. This is what makes the proguard-rules keep rule enforceable.
      - name: Verify Health Connect record classes are not obfuscated
        run: |
          ./gradlew :app:minifyProdReleaseWithR8
          # The minify task alone writes the mapping under intermediates/ (the outputs/mapping
          # copy is only produced by a later assemble step, which we don't run here since it
          # would need release signing). Locate it wherever AGP puts it rather than hardcode.
          MAP=$(find app/build -type f -name mapping.txt -path '*prodRelease*' | head -1)
          if [ -z "$MAP" ]; then
            echo "::error::R8 mapping.txt not produced by minifyProdReleaseWithR8"
            find app/build -name mapping.txt || true
            exit 1
          fi
          echo "Using R8 mapping: $MAP"
          # Class-level lines look like "orig.Name -> target:"; for HC record classes the target
          # must remain the identical real name. Any other target means it was obfuscated.
          BAD=$(grep -E '^androidx\.health\.connect\.client\.records\.[A-Za-z0-9]+ -> ' "$MAP" \
                | grep -vE ' -> androidx\.health\.connect\.client\.records\.' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Health Connect record classes are obfuscated by R8 — saved views will"
            echo "::error::break on update (issue #56). Ensure the -keepnames rule in"
            echo "::error::app/proguard-rules.pro covers androidx.health.connect.client.records.**"
            echo "$BAD"
            exit 1
          fi
          echo "OK: Health Connect record classes retain their real names in the R8 mapping."

      # Screenshot baselines (app/src/test/screenshots) have historically not reproduced
      # off-CI, so instead of verifying against a possibly-stale golden we RECORD them in
      # the CI environment and auto-commit any
      #
      # The "font/anti-aliasing drift" this comment used to assert was measured and is WRONG:
      # 60 of the 72 divergent baselines were a timezone bug (a fixed instant rendered through
      # ZoneId.systemDefault()), fixed by pinning the test JVM to UTC. The remaining 12 are the
      # scroll-offset family in #73 -- +/-1 LSB antialias rounding at subpixel positions. Left
      # here because the wrong explanation sent one investigation down a dead end already.
      # change back to the PR branch. The reviewer then sees the real CI-rendered diff on
      # the PR. This records, it does not gate — the unit-test step above is the test gate.
      #
      # Gated to same-repo pull_request events only: fork PRs get a read-only GITHUB_TOKEN
      # (push would 403), and push-to-main runs have no PR head to commit onto.
      # -x testProdDebugUnitTest: the unit suite already ran above; don't re-run it.
      - name: Record screenshots and commit to PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          ./gradlew recordRoborazziTableDebug -x testProdDebugUnitTest
          if [ -n "$(git status --porcelain app/src/test/screenshots)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/test/screenshots
            git commit -m "ci: update screenshot baselines"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "No screenshot baseline changes to commit."
          fi

      # Publish on SUCCESS as well as failure. Previously `if: failure()`, which meant a green
      # run produced no test report at all — so the only way to see what a passing run actually
      # did was to have a local checkout. That makes a green tick unauditable by a reviewer who
      # is not on the build machine, which is most of them.
      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testProdDebugUnitTest/
          # `warn`, not `error`. `error` was tempting — a report that stops being produced should
          # be loud — but it fires in exactly the wrong case: a build that fails BEFORE the tests
          # run (compile error, or the #18 task-timeout hard-kill, which the comment at
          # build.gradle.kts:373 notes kills the worker without writing a report) produces no
          # report directory at all. The step still runs on failure, so `error` would stack a
          # second, misleading upload failure onto a job that already failed for a real reason.
          # Verified by reproducing it: a deliberate compile error leaves this directory absent.
          if-no-files-found: warn

      # The rendered screenshots, so a passing run is inspectable by a reviewer without a local
      # checkout — previously nothing at all was published on a green run.
      #
      # Gated identically to the record step above, deliberately. On a fork PR or a push to main
      # that step is skipped, so nothing re-renders and this would upload a byte-for-byte copy of
      # what is already committed in git — 6.3 MiB carrying zero information. Uploading only when
      # something was actually rendered is what makes the artifact mean anything.
      #
      # `error` is safe HERE (unlike on the test report above) because this directory is committed
      # to the repo: if the run got far enough to record, the path exists. It fires only if a
      # future change moves or deletes the baselines, which is precisely when we want to know.
      - name: Upload rendered screenshots
        if: >-
          (success() || failure()) &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-screenshots
          path: app/src/test/screenshots/
          if-no-files-found: error

      # The "Upload screenshot diffs" step that used to live here has been REMOVED rather than
      # made noisier. It pointed at app/build/outputs/roborazzi/, which is Roborazzi's *compare*
      # output — and build.gradle.kts:301 sets `roborazzi.test.compare = "false"` on every subset
      # task, record and verify alike. So nothing this workflow runs has ever written to that
      # directory, and the step has never uploaded a single file.
      #
      # It was masked by `if-no-files-found: ignore`, which made it report success while doing
      # nothing. Changing that to `warn` would have made it honest and permanently useless: a
      # warning on every run, forever, that can never indicate anything actionable. A step that
      # cannot produce output is not observability, it is furniture.
      #
      # If the verify gate is ever wired up (#64) and compare output is re-enabled, restore this
      # step then — with a path that something actually writes to.
